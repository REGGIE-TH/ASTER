name: Release ZIP on Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build distributable ZIP
        run: bash scripts/package_game.sh

      - name: Publish GitHub Release with ZIP
        uses: softprops/action-gh-release@v2
        with:
          files: dist/lily-chain-game.zip
          generate_release_notes: true
