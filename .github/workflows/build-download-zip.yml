name: Build Download ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build distributable ZIP
        run: bash scripts/package_game.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lily-chain-game-zip
          path: dist/lily-chain-game.zip
          if-no-files-found: error
