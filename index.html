<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lily & Chain: Spotlight Run</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Lily & Chain: Spotlight Run</h1>
      <p class="help">
        이동: ← → / 점프: Space / 대시: Z / 스포트라이트: X<br />
        두 캐릭터를 번갈아 조작하며 밤의 성역을 돌파하세요.
      </p>
      <canvas id="game" width="1280" height="720" aria-label="2D 횡스크롤 게임"></canvas>
      <section class="hud-help">
        <p>스포트라이트로 그림자 적을 약화시키고, 사슬 공격으로 마무리!</p>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
